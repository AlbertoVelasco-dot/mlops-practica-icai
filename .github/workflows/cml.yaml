name: MLOps with CML
on: [push, pull_request]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: DVC and Python setup
        uses: iterative/setup-dvc@v1
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.email "202208640@alu.comillas.edu"
          git config --global user.name "AlbertoVelasco-dot"

      - name: Restore DVC Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/dvc
          key: dvc-cache-${{ hashFiles('dvc.yaml', 'dvc.lock') }}
          restore-keys: |
            dvc-cache-

      # - name: DVC Pull
      #   env:
      #     DAGSHUB_API_KEY: ${{ secrets.DAGSHUB_API_KEY }}
      #     # Las credenciales de Dagshub son necesarias para acceder al almacenamiento remoto
      #   run: |
      #     dvc remote modify origin --local access_key_id $DAGSHUB_API_KEY
      #     dvc remote modify origin --local secret_access_key $DAGSHUB_API_KEY
      #     dvc pull -r origin

      - name: DVC Pull
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_API_KEY: ${{ secrets.DAGSHUB_API_KEY }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_API_KEY
          dvc pull -r origin

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements.txt
      - name: Install CML manually
        run: |
          npm install -g @dvcorg/cml
      - name: Run training script
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          # DVC repro ejecutará la etapa "train" y, por lo tanto, el script train.py
          dvc repro

  deploy-to-gke:
    needs: train-and-report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: DVC and Python setup
        uses: iterative/setup-dvc@v1
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Set up gcloud CLI and kubectl
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: 'latest'
          install_components: 'gke-gcloud-auth-plugin'

      # Acción oficial en lugar de "gcloud container clusters get-credentials":
      # escribe el token en el kubeconfig y evita que kubectl dependa de gke-gcloud-auth-plugin
      - name: Get GKE credentials
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: DVC Pull
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_API_KEY: ${{ secrets.DAGSHUB_API_KEY }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_API_KEY
          dvc pull -r origin

      - name: Configure Docker to use GCR
        run: gcloud auth configure-docker

      # trivy-action fijada al commit de v0.36.0 en lugar de @master:
      # en marzo de 2026 sus tags fueron comprometidos (ataque a la cadena de suministro)
      # y este job tiene acceso a la clave de GCP.

      # --- API (mlops-api): construir, escanear y subir ---
      - name: Build API Docker Image
        id: build_api
        run: |
          IMAGE_NAME="gcr.io/${{ vars.GCP_PROJECT_ID }}/mlops-api:latest"
          docker build -t $IMAGE_NAME .
          echo "IMAGE_API=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Trivy Scan for API Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_API }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push API Docker Image
        run: docker push ${{ env.IMAGE_API }}

      # --- WEB (mlops-web): construir, escanear y subir ---
      - name: Build Web Docker Image
        id: build_web
        run: |
          IMAGE_NAME="gcr.io/${{ vars.GCP_PROJECT_ID }}/mlops-web:latest"
          docker build -t $IMAGE_NAME -f Dockerfile.web .
          echo "IMAGE_WEB=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Trivy Scan for Web Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Web Docker Image
        run: docker push ${{ env.IMAGE_WEB }}

      - name: Deploy to GKE
        run: |
          # Poner el project id real en la ruta de las imágenes
          sed -i "s/tu-project-id/${{ vars.GCP_PROJECT_ID }}/" api-deployment.yaml web-deployment.yaml
          # Despliegue de la API
          kubectl apply -f api-deployment.yaml
          kubectl apply -f api-service.yaml
          # Despliegue de la Web
          kubectl apply -f web-deployment.yaml
          kubectl apply -f web-service.yaml
          # Con la etiqueta :latest el manifiesto no cambia, así que forzamos que los pods bajen la imagen nueva
          kubectl rollout restart deployment/mlops-api-deployment deployment/mlops-web-deployment
